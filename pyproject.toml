[project]
name = "naga-code"
version = "0.1.0"
description = "Naga Code: a local-first terminal coding agent for local LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pathspec>=1.1.1",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
naga = "naga_code.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a running local inference server (Ollama)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "E731", "B023"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
